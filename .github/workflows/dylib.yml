name: Build Dylib Purpou

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils clang

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          cd /tmp
          # Link direto pra SDK do iOS 16.5 (repositório do xybp888)
          curl -L -o sdk.tar.xz "https://github.com/xybp888/iOS-SDKs/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          # Extrai o SDK e joga na pasta do Theos
          tar -xf sdk.tar.xz -C $THEOS/sdks/
          # Verifica se a pasta existe
          ls -la $THEOS/sdks/

      - name: Compile
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: PurpouPanel-Dylib
          path: .theos/obj/arm64/PurpouPanel.dylib
          if-no-files-found: error
