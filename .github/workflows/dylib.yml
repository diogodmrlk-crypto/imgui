name: Build Dylib Purpou

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils clang

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK (Método Oficial do Theos)
        run: |
          export THEOS=$HOME/theos
          # O próprio Theos tem um script pra baixar os SDKs
          cd $THEOS/bin
          ./install-sdk
          
          # Se o comando acima não existir, tenta o script alternativo da comunidade:
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
             git clone --depth 1 https://github.com/theos/sdks.git /tmp/theos-sdks
             cp -r /tmp/theos-sdks/*.sdk $THEOS/sdks/ 2>/dev/null || true
          fi
          
          ls -la $THEOS/sdks/

      - name: Compile
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: PurpouPanel-Dylib
          path: .theos/obj/arm64/PurpouPanel.dylib
          if-no-files-found: error
