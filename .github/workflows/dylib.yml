name: Build Dylib Purpou

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make git curl xz-utils clang

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          export THEOS=$HOME/theos
          mkdir -p $THEOS/sdks
          cd /tmp
          
          # Tenta baixar várias versões até uma dar certo
          for version in 16.5 16.4 15.6 15.0 14.5; do
            echo "Tentando baixar SDK do iOS $version..."
            curl -L -s -f -o sdk.tar.xz "https://github.com/theos/sdks/releases/download/master/iPhoneOS${version}.sdk.tar.xz"
            
            # Se o arquivo tiver mais de 1MB, o download deu certo
            if [ -f sdk.tar.xz ] && [ $(stat -c%s sdk.tar.xz) -gt 1000000 ]; then
              echo "Download do SDK $version concluído!"
              tar -xf sdk.tar.xz -C $THEOS/sdks/
              rm sdk.tar.xz
              break
            fi
          done

          # Verifica se a pasta ficou vazia
          ls -la $THEOS/sdks/
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ] && [ ! -d "$THEOS/sdks/iPhoneOS15.6.sdk" ]; then
            echo "ERRO: Nenhum SDK foi encontrado."
            exit 1
          fi

      - name: Compile
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: PurpouPanel-Dylib
          path: .theos/obj/arm64/PurpouPanel.dylib
          if-no-files-found: error
