name: Build Dylib Purpou

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install Theos
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Install SDK
        run: |
          export THEOS=$HOME/theos
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ]; then
            mkdir -p $THEOS/sdks
            cd /tmp
            curl -L -o sdk.tar.xz "https://github.com/xybp888/iOS-SDKs/releases/download/master/iPhoneOS16.5.sdk.tar.xz" || true
            tar -xf sdk.tar.xz -C $THEOS/sdks/ || true
          fi

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Upload Dylib
        uses: actions/upload-artifact@v3
        with:
          name: PurpouPanel-Dylib
          path: .theos/obj/arm64/PurpouPanel.dylib
          if-no-files-found: error
