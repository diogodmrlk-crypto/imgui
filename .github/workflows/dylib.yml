name: Build Dylib Purpou

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-dylib:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos e SDK
        run: |
          export THEOS=$HOME/theos
          git clone --recursive https://github.com/theos/theos.git $THEOS
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          
          mkdir -p $THEOS/sdks
          cd /tmp
          curl -L -o sdk.tar.xz "https://github.com/xybp888/iOS-SDKs/releases/download/master/iPhoneOS16.5.sdk.tar.xz"
          tar -xf sdk.tar.xz -C $THEOS/sdks/

      - name: Compilar Dylib
        run: |
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean
          make package FINALPACKAGE=1

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurpouPanel-Dylib
          path: .theos/obj/arm64/PurpouPanel.dylib
          if-no-files-found: error
